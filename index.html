<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080c11">
<title>پاسخبرگ تستی</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="پاسخبرگ">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
 --bg:#080c11;--surface:#10161e;--surface2:#151d27;--surface3:#1b2531;
 --text:#f5f7fa;--muted:#9aa8b8;--line:#263241;--primary:#4f8cff;--primary2:#3677ef;
 --shadow:0 18px 55px rgba(0,0,0,.28);--radius:22px;
 --paper:#fff;--paper-bg:#f6f8fb;--paper-text:#101828;--paper-line:#e2e8f0;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:'Vazirmatn',Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text);-webkit-tap-highlight-color:transparent}
.paper{font-family:Tahoma,Arial,sans-serif}
*{-webkit-tap-highlight-color:transparent}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#263241;border-radius:999px}
::-webkit-scrollbar-thumb:hover{background:#344457}
.btn:focus-visible,.icon-btn:focus-visible,.fab:focus-visible,.custom-select-btn:focus-visible,.result-filter-btn:focus-visible,.delete-card:focus-visible,.custom-select-option:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
input[type=text]:focus-visible,input[type=number]:focus-visible{outline:none}
body{overflow-x:hidden}
button,input{font:inherit}button{cursor:pointer}
button:disabled{opacity:.55;cursor:not-allowed}
.app{min-height:100vh}.container{width:min(1100px,calc(100% - 28px));margin:auto}
.topbar{height:72px;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:18px}
.brand{font-weight:900;font-size:20px}.icon-btn{width:44px;height:44px;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:14px;font-size:19px;flex:0 0 auto}
.topbar-actions{display:flex;align-items:center;gap:8px}
.page{padding:12px 0 104px}.empty{text-align:center;color:var(--muted);padding:18vh 20px 0}.empty h2{color:var(--text);margin:0 0 8px}
.fab{position:fixed;right:24px;bottom:36px;width:62px;height:62px;border:0;border-radius:20px;background:var(--primary);color:#fff;font-size:32px;box-shadow:0 12px 30px rgba(79,140,255,.28);z-index:10}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.exam-card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:15px;cursor:pointer;transition:.18s;box-shadow:0 10px 30px rgba(0,0,0,.16);user-select:none;overflow:hidden;touch-action:pan-y}
.exam-card:hover{transform:translateY(-2px);border-color:#344457}
.exam-card-head{display:flex;align-items:flex-start;gap:8px;margin-bottom:6px}
.exam-card-icon{flex:0 0 auto;width:30px;height:30px;border-radius:10px;background:var(--surface3);display:flex;align-items:center;justify-content:center;font-size:15px}
.exam-title{font-weight:900;font-size:15px;padding-left:26px;line-height:1.4;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical}
.meta{color:var(--muted);font-size:12px;line-height:1.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exam-date{color:var(--muted);font-size:11px;margin-top:6px;display:flex;align-items:center;gap:4px}
.progress{height:5px;background:#222c38;border-radius:999px;overflow:hidden;margin-top:10px}.progress-fill{height:100%;border-radius:999px;transition:width .4s}
.red{background:#ef4444}.yellow{background:#eab308}.green{background:#22c55e}.cyan{background:#14b8a6}
.delete-card{position:absolute;top:10px;left:10px;width:28px;height:28px;border:0;border-radius:9px;background:#28151a;color:#fca5a5;display:none;font-size:15px;z-index:2}
.exam-card.show-delete .delete-card{display:block}
.home-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.home-stat{background:var(--surface2);border:1px solid var(--line);border-radius:16px;padding:12px 6px;text-align:center}
.home-stat.streak{background:linear-gradient(160deg,#2a1a0d,var(--surface2))}
.home-stat .v{font-size:19px;font-weight:900}.home-stat .k{font-size:10.5px;color:var(--muted);margin-top:3px}
.home-toolbar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.home-search{flex:1 1 180px;position:relative}
.home-search input{width:100%;border:1px solid var(--line);background:var(--surface);color:var(--text);padding:12px 14px 12px 14px;border-radius:14px;outline:none;transition:.2s}
.home-search input:focus{border-color:#679cff;box-shadow:0 0 0 4px rgba(79,140,255,.12)}
.custom-select{position:relative;flex:0 0 auto}
.custom-select-btn{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--text);padding:12px 14px;border-radius:14px;font-weight:700;font-size:13px;white-space:nowrap}
.custom-select-btn .arrow{font-size:11px;color:var(--muted);transition:.15s}
.custom-select.open .custom-select-btn .arrow{transform:rotate(180deg)}
.custom-select-menu{position:absolute;top:calc(100% + 6px);left:0;min-width:170px;background:var(--surface2);border:1px solid var(--line);border-radius:14px;box-shadow:0 15px 40px rgba(0,0,0,.35);padding:6px;z-index:20;display:flex;flex-direction:column;gap:2px}
.custom-select-option{text-align:right;background:transparent;border:0;color:var(--text);padding:10px 12px;border-radius:10px;font-size:13px;font-weight:600}
.custom-select-option:hover{background:var(--surface3)}
.custom-select-option.active{color:var(--primary);font-weight:800;background:rgba(79,140,255,.1)}
.no-results{text-align:center;color:var(--muted);padding:10vh 20px 0}
.autocomplete-field{position:relative}
.autocomplete-menu{position:fixed;background:var(--surface2);border:1px solid var(--line);border-radius:14px;box-shadow:0 15px 40px rgba(0,0,0,.35);padding:6px;z-index:1000;display:none;flex-direction:column;gap:2px;max-height:230px;overflow-y:auto}
.autocomplete-menu.open{display:flex}
.autocomplete-option{text-align:right;background:transparent;border:0;color:var(--text);padding:11px 13px;border-radius:10px;font-size:13.5px;font-weight:600;width:100%}
.autocomplete-option:hover{background:var(--surface3)}
.autocomplete-option:active{background:rgba(79,140,255,.16)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px}
.page-title{font-size:26px;margin:0 0 7px;font-weight:900}.page-subtitle{color:var(--muted);margin:0 0 24px}
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.field{display:flex;flex-direction:column;gap:8px}.field.full{grid-column:1/-1}
.range-row{display:flex;flex-direction:row;gap:14px}
.range-field{display:flex;flex-direction:column;gap:8px;width:110px}
.range-field input{width:100%}
label{font-weight:700;font-size:14px}
input[type=text],input[type=number]{width:100%;border:1px solid var(--line);background:#0c1219;color:var(--text);padding:14px 15px;border-radius:14px;outline:none;transition:.2s;-moz-appearance:textfield}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input::placeholder{color:#64748b}input:focus{border-color:#679cff;box-shadow:0 0 0 4px rgba(79,140,255,.12)}
.segment{display:flex;gap:10px;flex-wrap:wrap}
.segment label{display:flex;align-items:center;gap:10px;padding:12px 15px;border:1px solid var(--line);border-radius:14px;background:#0c1219;cursor:pointer;transition:.15s}
.segment label.active{border-color:var(--primary);background:rgba(79,140,255,.12)}
.segment input{appearance:none;-webkit-appearance:none;width:19px;height:19px;flex:0 0 auto;margin:0;border-radius:50%;border:2px solid #3a4758;background:#0c1219;position:relative;transition:.15s}
.segment input:checked{border-color:var(--primary)}
.segment input:checked::after{content:'';position:absolute;inset:3px;border-radius:50%;background:var(--primary)}
.actions{display:flex;gap:10px;justify-content:flex-start;margin-top:24px;flex-wrap:wrap}.btn{border:0;border-radius:14px;padding:13px 20px;font-weight:800}
.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:var(--primary2)}.btn-secondary{background:#202a36;color:#dbe4ee}.btn-danger{background:#3a171b;color:#fecaca}
.notice{background:#0d2038;border:1px solid #204a7c;color:#b9d7ff;padding:12px 14px;border-radius:14px;margin-top:16px;font-size:13px;line-height:1.8}
.error{background:#33171a;border:1px solid #6d252c;color:#fecaca;padding:12px 14px;border-radius:14px;margin-top:16px;line-height:1.8}
.warning{background:#34270d;border:1px solid #735817;color:#fde68a;padding:12px 14px;border-radius:14px;margin-top:16px;line-height:1.8}

.quiz-page{min-height:100vh;background:var(--bg);color:var(--text);padding-bottom:34px}
.quiz-page .container{width:min(1100px,calc(100% - 28px))}
.paper-shell{display:flex;justify-content:center}.paper{width:fit-content;min-width:min(100%,760px);max-width:100%;background:var(--paper);color:var(--paper-text);border:1px solid var(--paper-line);border-radius:24px;box-shadow:0 20px 60px rgba(0,0,0,.25);padding:24px 24px 24px 12px}
.paper .page-title{color:var(--paper-text)}.paper .page-subtitle{color:#64748b}
.quiz-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.timer{background:#101828;color:#fff;border-radius:14px;padding:10px 14px;font-weight:900;direction:ltr}
.count-badge{background:#eef2ff;color:#3730a3;border-radius:999px;padding:7px 11px;font-size:13px;font-weight:800}
.questions{display:flex;flex-direction:column;gap:10px}.q-row{display:grid;grid-template-columns:80px auto;direction:ltr;align-items:center;gap:12px;background:#fff;border:1px solid var(--paper-line);padding:12px;border-radius:18px}
.q-num{font-weight:900;text-align:center;color:#101828;direction:ltr}.options{display:grid;grid-template-columns:repeat(4,minmax(62px,1fr));gap:8px;direction:ltr}
.opt{border:1px solid #cbd5e1;background:#f8fafc;color:#334155;border-radius:13px;padding:12px 8px;font-weight:900;transition:.15s}.opt.selected{background:#000;color:#fff;border-color:#000}.opt:active{transform:scale(.97)}

.questions.sheet-mode{gap:0;border:1px solid var(--sheet-border,#b9cbe6);border-radius:14px;overflow:hidden;background:var(--sheet-bg,#f4f8fd);direction:ltr;--sheet-border:#b9cbe6;--sheet-bg:#f4f8fd;--sheet-num-bg:#cfe1f6;--sheet-line:#a3c0e6;--sheet-num-color:#0d1f3d;--sheet-opt-border:#a9c2e6;--sheet-opt-color:#3a6bb8}
.questions.sheet-mode.theme-red{--sheet-border:#e6b9b9;--sheet-bg:#fdf4f4;--sheet-num-bg:#f6cfcf;--sheet-line:#e6a3a3;--sheet-num-color:#3d0d0d;--sheet-opt-border:#e6a9a9;--sheet-opt-color:#b83a3a}
.questions.sheet-mode.theme-green{--sheet-border:#b9e6c0;--sheet-bg:#f4fdf6;--sheet-num-bg:#cff6d6;--sheet-line:#a3e6ab;--sheet-num-color:#0d3d17;--sheet-opt-border:#a9e6b0;--sheet-opt-color:#3ab84f}
.sheet-mode .q-group{display:flex;flex-direction:column;position:relative}
.sheet-mode .q-group::before{content:'';position:absolute;left:0;top:0;width:48px;height:100%;background:var(--sheet-num-bg);z-index:0}
.sheet-mode .q-group-spacer{position:relative;display:grid;grid-template-columns:48px auto;height:50px;padding:0 10px 0 0}
.sheet-mode .q-group-spacer::after{content:'';position:absolute;left:0;right:0;top:22px;border-top:2px solid var(--sheet-line)}
.sheet-mode .q-group-spacer-num{background:var(--sheet-num-bg)}
.sheet-mode .q-row{grid-template-columns:48px auto;background:transparent;border:0;border-radius:0;padding:5px 10px 5px 0;gap:10px;align-items:center;position:relative;z-index:1}
.sheet-mode .q-num{background:transparent;color:var(--sheet-num-color);font-size:25px;font-weight:900;text-align:center;position:relative;top:1px}
.questions.sheet-mode .q-group:first-child::before{border-top-right-radius:10px;border-top-left-radius:10px}
.questions.sheet-mode .q-group:last-child::before{border-bottom-right-radius:10px;border-bottom-left-radius:10px}
.sheet-mode .options{width:100%;display:flex;justify-content:space-between;gap:0}
.sheet-mode .opt{border:1.5px solid var(--sheet-opt-border);background:#fff;color:var(--sheet-opt-color);border-radius:11px;padding:0;height:29px;font-weight:900;font-size:16px;flex:0 0 18%}
.sheet-mode .options{padding-right:8%;}
.sheet-mode .opt.selected{background:#101010;color:#fff;border-color:#101010}
.sheet-mode .opt:active{transform:none}

.paper.key-mode{background:#10161e;color:#f5f7fa;border-color:#222c38}
.paper.key-mode .page-title{color:#f5f7fa}
.paper.key-mode .page-subtitle{color:#8592a3}
.paper.key-mode .count-badge{background:#1b2531;color:#c7d2e0}
.paper.key-mode .q-row{background:#151b24;border:1px solid #222c38;border-radius:14px}
.paper.key-mode .q-num{color:#e7ecf2}
.paper.key-mode .opt{background:#1b2531;border:1px solid #2a3644;color:#c7d2e0;border-radius:10px}
.paper.key-mode .opt.selected{background:#f5f7fa;color:#10161e;border-color:#f5f7fa}
.paper.key-mode .notice{background:#182635;border:1px solid #2a4360;color:#a9c6e6}
.paper.key-mode .warning{background:#2a2415;border:1px solid #4a3f1c;color:#e8d38a}
.paper.key-mode .btn-secondary{background:#1b2531;color:#dbe4ee}

.paper.quiz-mode{background:#10161e;color:#f5f7fa;border-color:#222c38}
.paper.quiz-mode .page-title{color:#f5f7fa}
.paper.quiz-mode .page-subtitle{color:#8592a3}
.paper.quiz-mode .count-badge{background:#1b2531;color:#c7d2e0}
.paper.quiz-mode .notice{background:#182635;border:1px solid #2a4360;color:#a9c6e6}
.paper.quiz-mode .btn-secondary{background:#1b2531;color:#dbe4ee}
.paper .btn-secondary{background:#e9eef5;color:#334155}.paper .notice{background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af}.paper .warning{background:#fffbeb;border:1px solid #fde68a;color:#92400e}.paper .error{background:#fef2f2;border:1px solid #fecaca;color:#991b1b}

.result-top-card{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;min-height:34vh;background:var(--surface2);border:1px solid var(--line);border-radius:var(--radius);padding:24px}
.result-ring-col{display:flex;flex-direction:column;align-items:center;gap:10px}
.result-ring{width:152px;height:152px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.result-ring-inner{width:118px;height:118px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center}
.result-ring-percent{font-size:22px;font-weight:900;color:var(--text);direction:ltr}
.result-time{color:var(--muted);font-size:13px;direction:rtl}
.result-stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;width:100%;max-width:620px}
.result-stat-item{background:var(--surface3);border:1px solid var(--line);border-radius:16px;padding:14px 8px;text-align:center;direction:rtl}
.result-stat-item .v{font-size:22px;font-weight:900;margin-bottom:5px}.result-stat-item .k{font-size:11.5px;color:var(--muted)}
.result-filter-row{display:flex;direction:ltr;gap:10px;margin-top:16px;flex-wrap:wrap}
.result-filter-btn{flex:1 1 130px;padding:13px 10px;border-radius:14px;border:1px solid var(--line);background:var(--surface2);color:var(--text);font-weight:800;font-size:13px;text-align:center;transition:.15s}
.result-filter-btn:hover{border-color:#415268}
.result-filter-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.result-content{margin-top:16px}
.result-cards-grid{display:flex;flex-direction:column;gap:5px;width:100%}
.result-card{display:flex;align-items:center;justify-content:space-between;gap:14px;border-radius:10px;padding:5px 14px;border:1px solid transparent;width:100%}
.result-card-num{font-weight:900;font-size:14px;flex:0 0 auto;white-space:nowrap}
.result-card-answers{display:flex;gap:18px;flex-wrap:wrap;justify-content:flex-end}
.result-card-answer{font-size:12.5px;line-height:1.5;white-space:nowrap}
.result-card-answer strong{font-size:13.5px}
.result-card.correct{background:#052e16;border-color:#14532d;color:#fff}.result-card.correct strong{color:#fff}
.result-card.wrong{background:#450a0a;border-color:#7f1d1d;color:#fff}.result-card.wrong strong{color:#fff}
.result-card.blank{background:#1e293b;border-color:#334155;color:#fff}.result-card.blank strong{color:#fff}
.result-empty{color:var(--muted);text-align:center;padding:30px 0;font-size:14px}
.numbers{padding:14px;display:flex;flex-wrap:wrap;gap:8px;max-height:430px;overflow:auto}.number-pill{min-width:44px;padding:9px 10px;text-align:center;background:#fff;color:#101828;border-radius:10px;font-weight:800;font-size:13px}
.number-pill.correct{background:#22c55e;color:#052e16}.number-pill.wrong{background:#ef4444;color:#fff}.number-pill.blank{background:#fff;color:#101828}
.wrong-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}.wrong-item{background:#391a1d;border:1px solid #64272d;border-radius:14px;padding:12px;line-height:1.9}.wrong-item strong{font-size:14px}.wrong-item div{font-size:12px;color:#fecaca}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;padding:20px;z-index:30}.modal{width:min(520px,100%);background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:24px;box-shadow:0 25px 80px rgba(0,0,0,.45)}.modal h2{margin-top:0}.small{font-size:12px;color:var(--muted);line-height:1.8}.backup-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.hidden{display:none!important}

/* Drawer (hamburger menu) */
.drawer-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0);z-index:50;transition:background .25s}
.drawer-backdrop.open{background:rgba(0,0,0,.55)}
.drawer-panel{position:fixed;top:0;bottom:0;left:0;width:min(78%,300px);background:var(--surface);border-left:1px solid var(--line);box-shadow:8px 0 34px rgba(0,0,0,.4);transform:translateX(-100%);transition:transform .25s cubic-bezier(.4,0,.2,1);z-index:51;padding:22px 14px;display:flex;flex-direction:column;gap:4px;overflow-y:auto}
.drawer-backdrop.open .drawer-panel{transform:translateX(0)}
.drawer-header{font-weight:900;font-size:16.5px;padding:6px 10px 18px;border-bottom:1px solid var(--line);margin-bottom:10px}
.drawer-item{display:flex;align-items:center;gap:12px;padding:14px 12px;border-radius:14px;background:transparent;border:0;color:var(--text);font-weight:700;font-size:14.5px;text-align:right;width:100%}
.drawer-item:hover{background:var(--surface3)}
.drawer-item .di-icon{font-size:17px;flex:0 0 auto;width:22px;text-align:center}

/* Browse tests feature */
.result-card.neutral{background:var(--surface3);border-color:var(--line);color:var(--text)}
.result-card.neutral strong{color:var(--text)}
.result-card.clickable{cursor:pointer;transition:.15s}
.result-card.clickable:hover{border-color:#415268}
.browse-tab-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.browse-toolbar-row{display:flex;margin-bottom:14px}
.browse-item-wrap{width:100%}
.browse-item-card{display:flex;align-items:center;gap:10px;border-radius:10px;padding:10px 14px;border:1px solid transparent;width:100%}
.browse-item-card.wrong{background:#450a0a;border-color:#7f1d1d;color:#fff}
.browse-item-card.blank{background:#1e293b;border-color:#334155;color:#fff}
.bi-source{font-size:12.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1 1 auto;min-width:0}
.bi-num{font-weight:900;font-size:13.5px;flex:0 0 auto;white-space:nowrap}
.bi-arrow{flex:0 0 auto;width:30px;height:30px;border:0;border-radius:9px;background:rgba(255,255,255,.14);color:#fff;font-size:13px;transition:.18s}
.bi-arrow:hover{background:rgba(255,255,255,.22)}
.bi-arrow.open{transform:rotate(180deg)}
.bi-answer-panel{background:rgba(0,0,0,.22);border-radius:0 0 12px 12px;padding:10px 14px;margin-top:-4px;font-size:12.5px;line-height:1.9;display:flex;gap:16px;flex-wrap:wrap}

.tour-dots{display:flex;justify-content:center;gap:6px;margin:16px 0 4px}
.tour-dot{width:7px;height:7px;border-radius:50%;background:#2a3644;transition:.2s}
.tour-dot.active{background:var(--primary);width:18px;border-radius:4px}
.tour-modal p{color:#c7d2e0;line-height:2;font-size:13.5px;margin:0 0 4px}
.modal-backdrop.confirm-backdrop{z-index:40}
.confirm-modal p{color:var(--muted);line-height:1.9;margin:0 0 18px}
.confirm-modal .actions{margin-top:0}

.toast-stack{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:50;display:flex;flex-direction:column;gap:8px;align-items:center;width:min(420px,calc(100% - 32px))}
.toast{background:var(--surface3);border:1px solid var(--line);color:var(--text);padding:13px 18px;border-radius:14px;box-shadow:0 15px 40px rgba(0,0,0,.35);font-size:13.5px;font-weight:700;text-align:center;width:100%;animation:toast-in .22s ease-out}
.toast.toast-error{background:#33171a;border-color:#6d252c;color:#fecaca}
.toast.toast-success{background:#0f2a1a;border-color:#1f5c37;color:#bbf7d0}
@keyframes toast-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

.wizard-steps{display:flex;align-items:center;gap:6px;margin-bottom:20px}
.wizard-step{flex:1 1 0;height:5px;border-radius:999px;background:#222c38}
.wizard-step.active{background:var(--primary)}.wizard-step.done{background:#3a5a8f}
.wizard-step-label{color:var(--muted);font-size:12.5px;font-weight:700;margin-bottom:14px}
.wizard-body{animation:wizard-fade .18s ease-out}
@keyframes wizard-fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.live-count{display:inline-flex;align-items:center;gap:6px;background:#0d2038;border:1px solid #204a7c;color:#b9d7ff;padding:8px 14px;border-radius:999px;font-size:12.5px;font-weight:800;margin-top:10px}

.page-anim{animation:page-fade .22s ease-out}
@keyframes page-fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

@media(max-width:760px){
 .container,.quiz-page .container{width:min(100% - 18px,1100px)}.form-grid{grid-template-columns:1fr}
 .paper{min-width:100%;padding:17px 17px 17px 0}.q-row{grid-template-columns:58px auto;gap:9px}.options{grid-template-columns:repeat(4,minmax(50px,1fr));gap:6px}.opt{padding:11px 5px}
 .result-top-card{min-height:30vh;padding:18px;gap:16px}
}
@media(max-width:480px){.page-title{font-size:22px}.panel{padding:17px}.fab{right:17px;bottom:29px}
 .grid{gap:8px}.exam-card{padding:11px}.exam-title{font-size:13.5px;padding-left:24px;margin-bottom:3px}.meta{font-size:10.5px;line-height:1.7}
 .home-stats{grid-template-columns:1fr 1fr}
 .result-top-card{min-height:auto;padding:16px;gap:12px}
 .result-ring{width:96px;height:96px}.result-ring-inner{width:74px;height:74px}.result-ring-percent{font-size:15px}
 .result-stats-grid{grid-template-columns:1fr 1fr;gap:8px}.result-stat-item{padding:10px}.result-stat-item .v{font-size:17px}.result-stat-item .k{font-size:10.5px}
 .result-filter-btn{font-size:11.5px;padding:10px 6px;flex:1 1 45%}
}

<body>
<div id="app"></div>
<div id="toastStack" class="toast-stack"></div>
<div id="autoSuggestMenu" class="autocomplete-menu"></div>
<script>
//---------------------------------------------------------------------
//
// QR Code Generator for JavaScript
//
// Copyright (c) 2009 Kazuhiko Arase
//
// URL: http://www.d-project.com/

//  http://www.opensource.org/licenses/mit-license.php

// DENSO WAVE INCORPORATED
//  http://www.denso-wave.com/qrcode/faqpatent-e.html

//---------------------------------------------------------------------

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = new Array();

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw new Error('code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')');
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw new Error(row + ',' + col);
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;
      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg';
      qrSvg += ' width="' + size + 'px"';
      qrSvg += ' height="' + size + 'px"';
      qrSvg += ' xmlns="http://www.w3.org/2000/svg"';
      qrSvg += '>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createImgTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createImgTag(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    return _this;
  };

  //---------------------------------------------------------------------
  // qrcode.stringToBytes
  //---------------------------------------------------------------------

  qrcode.stringToBytes = function(s) {
    var bytes = new Array();
    for (var i = 0; i < s.length; i += 1) {
      var c = s.charCodeAt(i);
      bytes.push(c & 0xff);
    }
    return bytes;
  };

  //---------------------------------------------------------------------
  // qrcode.createStringToBytes
  //---------------------------------------------------------------------

  /**
   * @param unicodeData base64 string of byte array.
   * [16bit Unicode],[16bit Bytes], ...
   * @param numChars
   */
  qrcode.createStringToBytes = function(unicodeData, numChars) {

    // create conversion map.

    var unicodeMap = function() {

      var bin = base64DecodeInputStream(unicodeData);
      var read = function() {
        var b = bin.read();
        if (b == -1) throw new Error();
        return b;
      };

      var count = 0;
      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;
      }
      if (count != numChars) {
        throw new Error(count + ' != ' + numChars);
      }

      return unicodeMap;
    }();

    var unknownChar = '?'.charCodeAt(0);

    return function(s) {
      var bytes = new Array();
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];
          if (typeof b == 'number') {
            if ( (b & 0xff) == b) {
              // 1byte
              bytes.push(b);
            } else {
              // 2bytes
              bytes.push(b >>> 8);
              bytes.push(b & 0xff);
            }
          } else {
            bytes.push(unknownChar);
          }
        }
      }
      return bytes;
    };
  };

  //---------------------------------------------------------------------
  // QRMode
  //---------------------------------------------------------------------

  var QRMode = {
    MODE_NUMBER :    1 << 0,
    MODE_ALPHA_NUM : 1 << 1,
    MODE_8BIT_BYTE : 1 << 2,
    MODE_KANJI :     1 << 3
  };

  //---------------------------------------------------------------------
  // QRErrorCorrectionLevel
  //---------------------------------------------------------------------

  var QRErrorCorrectionLevel = {
    L : 1,
    M : 0,
    Q : 3,
    H : 2
  };

  //---------------------------------------------------------------------
  // QRMaskPattern
  //---------------------------------------------------------------------

  var QRMaskPattern = {
    PATTERN000 : 0,
    PATTERN001 : 1,
    PATTERN010 : 2,
    PATTERN011 : 3,
    PATTERN100 : 4,
    PATTERN101 : 5,
    PATTERN110 : 6,
    PATTERN111 : 7
  };

  //---------------------------------------------------------------------
  // QRUtil
  //---------------------------------------------------------------------

  var QRUtil = function() {

    var PATTERN_POSITION_TABLE = [
      [],
      [6, 18],
      [6, 22],
      [6, 26],
      [6, 30],
      [6, 34],
      [6, 22, 38],
      [6, 24, 42],
      [6, 26, 46],
      [6, 28, 50],
      [6, 30, 54],
      [6, 32, 58],
      [6, 34, 62],
      [6, 26, 46, 66],
      [6, 26, 48, 70],
      [6, 26, 50, 74],
      [6, 30, 54, 78],
      [6, 30, 56, 82],
      [6, 30, 58, 86],
      [6, 34, 62, 90],
      [6, 28, 50, 72, 94],
      [6, 26, 50, 74, 98],
      [6, 30, 54, 78, 102],
      [6, 28, 54, 80, 106],
      [6, 32, 58, 84, 110],
      [6, 30, 58, 86, 114],
      [6, 34, 62, 90, 118],
      [6, 26, 50, 74, 98, 122],
      [6, 30, 54, 78, 102, 126],
      [6, 26, 52, 78, 104, 130],
      [6, 30, 56, 82, 108, 134],
      [6, 34, 60, 86, 112, 138],
      [6, 30, 58, 86, 114, 142],
      [6, 34, 62, 90, 118, 146],
      [6, 30, 54, 78, 102, 126, 150],
      [6, 24, 50, 76, 102, 128, 154],
      [6, 28, 54, 80, 106, 132, 158],
      [6, 32, 58, 84, 110, 136, 162],
      [6, 26, 54, 82, 110, 138, 166],
      [6, 30, 58, 86, 114, 142, 170]
    ];
    var G15 = (1 << 10) | (1 << 8) | (1 << 5) | (1 << 4) | (1 << 2) | (1 << 1) | (1 << 0);
    var G18 = (1 << 12) | (1 << 11) | (1 << 10) | (1 << 9) | (1 << 8) | (1 << 5) | (1 << 2) | (1 << 0);
    var G15_MASK = (1 << 14) | (1 << 12) | (1 << 10) | (1 << 4) | (1 << 1);

    var _this = {};

    var getBCHDigit = function(data) {
      var digit = 0;
      while (data != 0) {
        digit += 1;
        data >>>= 1;
      }
      return digit;
    };

    _this.getBCHTypeInfo = function(data) {
      var d = data << 10;
      while (getBCHDigit(d) - getBCHDigit(G15) >= 0) {
        d ^= (G15 << (getBCHDigit(d) - getBCHDigit(G15) ) );
      }
      return ( (data << 10) | d) ^ G15_MASK;
    };

    _this.getBCHTypeNumber = function(data) {
      var d = data << 12;
      while (getBCHDigit(d) - getBCHDigit(G18) >= 0) {
        d ^= (G18 << (getBCHDigit(d) - getBCHDigit(G18) ) );
      }
      return (data << 12) | d;
    };

    _this.getPatternPosition = function(typeNumber) {
      return PATTERN_POSITION_TABLE[typeNumber - 1];
    };

    _this.getMaskFunction = function(maskPattern) {

      switch (maskPattern) {

      case QRMaskPattern.PATTERN000 :
        return function(i, j) { return (i + j) % 2 == 0; };
      case QRMaskPattern.PATTERN001 :
        return function(i, j) { return i % 2 == 0; };
      case QRMaskPattern.PATTERN010 :
        return function(i, j) { return j % 3 == 0; };
      case QRMaskPattern.PATTERN011 :

  var base64EncodeOutputStream = function() {

    var decode = function(c) {

      // Global Color Map

      // black

      out.writeByte(0x00);
      out.writeByte(0x00);

      // white
      out.writeByte(0xff);
      out.writeByte(0xff);
      out.writeByte(0xff);

      //---------------------------------
      // Image Descriptor

      out.writeShort(0);
      out.writeShort(0);

      //---------------------------------

      out.writeBytes(raster, offset, raster.length - offset);

    var getLZWRaster = function(lzwMinCodeSize) {

  var createImgTag = function(width, height, getPixel, alt) {

    gif.write(b);

    var base64 = base64EncodeOutputStream();
    var bytes = b.toByteArray();
    for (var i = 0; i < bytes.length; i += 1) {
      base64.writeByte(bytes[i]);
    }
    base64.flush();

    var img = '';
    img += '<img';
    img += '\u0020src="';
    img += 'data:image/gif;base64,';
    img += base64;
    img += '"';
    img += '\u0020width="';
    img += width;
    img += '"';
    img += '\u0020height="';
    img += height;
    img += '"';

<script>
const STORAGE_KEY='test-answer-sheet-v3';
const TOUR_KEY='test-answer-sheet-tour-v1';
const SETTINGS_KEY='test-answer-sheet-settings-v1';
let exams=loadExams();
let settings=loadSettings();
let state={page:'home',draft:null,quizAnswers:{},keyAnswers:{},timerStart:null,timerSeconds:0,timerInterval:null,currentExamId:null,resultTab:'all',homeSearch:'',homeSort:'date-desc',wizardStep:1,browseSubject:null,browseTab:'all',browseSortOrder:'asc',browseSourceFilter:null,browseOpenKey:null,browseFilterDraft:null};
function showToast(msg,type){
 let stack=document.getElementById('toastStack');
 let el=document.createElement('div');
 el.className='toast'+(type?' toast-'+type:'');
 el.textContent=msg;
 stack.appendChild(el);
 setTimeout(()=>{el.style.opacity='0';el.style.transform='translateY(10px)';el.style.transition='.2s';setTimeout(()=>el.remove(),220)},2400)
}
function showConfirm(message,onConfirm,confirmLabel){
 document.getElementById('confirmModal')?.remove();
 document.body.insertAdjacentHTML('beforeend',`<div class="modal-backdrop confirm-backdrop" id="confirmModal"><div class="modal confirm-modal"><h2>تأیید</h2><p>${escapeHtml(message)}</p><div class="actions"><button class="btn btn-danger" id="confirmYes">${escapeHtml(confirmLabel||'تأیید')}</button><button class="btn btn-secondary" onclick="document.getElementById('confirmModal').remove()">انصراف</button></div></div></div>`);
 document.getElementById('confirmYes').onclick=()=>{document.getElementById('confirmModal').remove();onConfirm()}
}
function loadExams(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]')}catch{return[]}}
function saveExams(){localStorage.setItem(STORAGE_KEY,JSON.stringify(exams))}
function loadSettings(){let d={groupSize:5,theme:'blue',streak:{count:0,lastDate:null}};try{let s={...d,...JSON.parse(localStorage.getItem(SETTINGS_KEY)||'{}')};s.streak=s.streak||d.streak;return s}catch{return d}}
function saveSettings(){localStorage.setItem(SETTINGS_KEY,JSON.stringify(settings))}
function setGroupSize(v){settings.groupSize=Number(v);saveSettings();if(state.page==='quiz')renderQuiz(false)}
function setTheme(v){settings.theme=v;saveSettings();if(state.page==='quiz')renderQuiz(false)}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function formatTime(sec){sec=Math.max(0,Math.floor(sec));let h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return(h?String(h).padStart(2,'0')+':':'')+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}
function percentColor(p){if(p<=20)return'red';if(p<=50)return'yellow';if(p<=79)return'green';return'cyan'}
function render(){if(state.page==='home')renderHome();else if(state.page==='setup')renderSetup();else if(state.page==='quiz')renderQuiz(false);else if(state.page==='key')renderQuiz(true);else if(state.page==='browse-list')renderBrowseList();else if(state.page==='browse-subject')renderBrowseSubject();else renderResult()}
function formatDate(iso){
 if(!iso)return'—';
 try{return new Date(iso).toLocaleDateString('fa-IR',{month:'2-digit',day:'2-digit'})}catch{return'—'}
}
function weekAveragePercent(){
 let weekAgo=Date.now()-7*24*3600*1000;
 let recent=exams.filter(e=>e.createdAt&&new Date(e.createdAt).getTime()>=weekAgo);
 if(!recent.length)return null;
 return recent.reduce((s,e)=>s+(e.result?.percent??0),0)/recent.length;
}
function getFilteredExams(){
 let list=exams.slice();
 let q=(state.homeSearch||'').trim();
 if(q)list=list.filter(e=>[e.subject,e.topic,e.source].some(v=>(v||'').includes(q)));
 if(state.homeSort==='date-asc')list.sort((a,b)=>new Date(a.createdAt||0)-new Date(b.createdAt||0));
 else if(state.homeSort==='percent-desc')list.sort((a,b)=>(b.result?.percent??0)-(a.result?.percent??0));
 else if(state.homeSort==='percent-asc')list.sort((a,b)=>(a.result?.percent??0)-(b.result?.percent??0));
 else if(state.homeSort==='subject-asc')list.sort((a,b)=>(a.subject||'').localeCompare(b.subject||'','fa'));
 else list.sort((a,b)=>new Date(b.createdAt||0)-new Date(a.createdAt||0));
 return list;
}
function setHomeSearch(v){state.homeSearch=v;renderHomeList()}
function setHomeSort(v){state.homeSort=v;renderHomeList()}
function toggleSegmentActive(el){
 let group=el.closest('.segment');
 group.querySelectorAll('label').forEach(l=>l.classList.remove('active'));
 el.closest('label').classList.add('active');
}
const SORT_LABELS={'date-desc':'جدیدترین','date-asc':'قدیمی‌ترین','percent-desc':'بیشترین درصد','percent-asc':'کمترین درصد','subject-asc':'نام درس'};
function toggleSortMenu(ev){
 ev?.stopPropagation();
 let el=document.getElementById('sortDropdown');
 el.classList.toggle('open');
 document.getElementById('sortMenu').classList.toggle('hidden');
}
function chooseSort(v){
 setHomeSort(v);
}
document.addEventListener('click',(e)=>{
 let dd=document.getElementById('sortDropdown');
 if(dd&&!dd.contains(e.target)){dd.classList.remove('open');document.getElementById('sortMenu')?.classList.add('hidden')}
});
function renderHomeList(){
 let list=getFilteredExams();
 let cards=list.map(e=>{let p=e.result?.percent??0;return`<div class="exam-card" data-id="${e.id}" onclick="openResult('${e.id}')">
 <button class="delete-card" onclick="event.stopPropagation();deleteExam('${e.id}')">×</button>
 <div class="exam-card-head"><div class="exam-card-icon">📝</div><div class="exam-title">${escapeHtml(e.subject||'بدون نام')}</div></div>
 <div class="meta">مبحث: ${escapeHtml(e.topic||'—')}<br>منبع: ${escapeHtml(e.source||'—')}</div>
 <div class="exam-date">🗓 ${formatDate(e.createdAt)}</div>
 <div class="progress"><div class="progress-fill ${percentColor(p)}" style="width:${Math.min(100,Math.max(0,p))}%"></div></div></div>`}).join('');
 let body=exams.length?(cards?`<div class="grid">${cards}</div>`:`<div class="no-results">با این جست‌وجو، آزمونی پیدا نشد.</div>`):`<div class="empty"><h2>هنوز آزمونی ثبت نشده</h2><p>برای ساخت اولین آزمون، روی دکمه + بزنید.</p></div>`;
 document.getElementById('homeListArea').innerHTML=body;
 attachCardInteractions();
}
function renderHome(){
 window.scrollTo(0,0);
 let avg=weekAveragePercent();
 document.getElementById('app').innerHTML=`<div class="container page-anim"><div class="topbar"><div class="brand">پاسخبرگ تستی</div><button class="icon-btn" onclick="openDrawer()">☰</button></div>
 <main class="page">
 <div class="home-stats">
  <div class="home-stat streak"><div class="v">🔥 ${settings.streak.count}</div><div class="k">استریک روزانه</div></div>
  <div class="home-stat"><div class="v">${exams.length}</div><div class="k">تعداد آزمون‌ها</div></div>
  <div class="home-stat"><div class="v">${avg==null?'—':avg.toFixed(0)+'٪'}</div><div class="k">میانگین هفته اخیر</div></div>
  <div class="home-stat"><div class="v">${exams.length?Math.round(exams.reduce((s,e)=>s+(e.result?.percent??0),0)/exams.length)+'٪':'—'}</div><div class="k">میانگین کل</div></div>
 </div>
 ${exams.length?`<div class="home-toolbar">
  <div class="home-search"><input type="text" placeholder="جست‌وجو در نام درس، مبحث یا منبع…" value="${escapeHtml(state.homeSearch)}" oninput="setHomeSearch(this.value)"></div>
  <div class="custom-select" id="sortDropdown">
   <button type="button" class="custom-select-btn" onclick="toggleSortMenu(event)"><span>${SORT_LABELS[state.homeSort]}</span><span class="arrow">⌄</span></button>
   <div class="custom-select-menu hidden" id="sortMenu">
    ${Object.entries(SORT_LABELS).map(([val,label])=>`<button type="button" class="custom-select-option ${state.homeSort===val?'active':''}" onclick="chooseSort('${val}')">${label}</button>`).join('')}
   </div>
  </div>
 </div>`:''}
 <div id="homeListArea"></div>
 </main><button class="fab" onclick="goSetup()">+</button></div>`;
 renderHomeList();
}
function attachCardInteractions(){
 document.querySelectorAll('.exam-card').forEach(card=>{
  let timer,startX=0,startY=0,moved=false;
  const start=(e)=>{startX=e.clientX;startY=e.clientY;moved=false;timer=setTimeout(()=>{card.classList.add('show-delete')},650)};
  const move=(e)=>{if(Math.abs(e.clientX-startX)>8||Math.abs(e.clientY-startY)>8){moved=true;clearTimeout(timer)}};
  const clearTouch=()=>clearTimeout(timer);
  const end=(e)=>{clearTouch();if(moved&&Math.abs(e.clientX-startX)>40&&Math.abs(e.clientX-startX)>Math.abs(e.clientY-startY))card.classList.add('show-delete')};
  card.addEventListener('pointerdown',start);
  card.addEventListener('pointermove',move);
  card.addEventListener('pointerup',end);
  card.addEventListener('pointerleave',clearTouch);
  card.addEventListener('pointercancel',clearTouch);
 })
}
function deleteExam(id){showConfirm('این آزمون حذف شود؟',()=>{exams=exams.filter(e=>e.id!==id);saveExams();renderHome();showToast('آزمون حذف شد','success')},'حذف')}
function goSetup(){state.page='setup';window.scrollTo(0,0);renderSetup()}
function freqValues(field){let counts={};exams.forEach(e=>{let v=(e[field]||'').trim();if(v)counts[v]=(counts[v]||0)+1});return Object.keys(counts).sort((a,b)=>counts[b]-counts[a])}
let currentSuggestField=null;
function positionSuggestMenu(input){
 let menu=document.getElementById('autoSuggestMenu'),r=input.getBoundingClientRect();
 let top=r.bottom+6,left=r.left,width=r.width;
 let maxTop=window.innerHeight-40;
 if(top>maxTop)top=Math.max(8,r.top-6-Math.min(230,menu.scrollHeight||230));
 menu.style.top=top+'px';menu.style.left=left+'px';menu.style.width=width+'px';
}
function renderSuggestMenu(field){
 let input=document.getElementById(field),menu=document.getElementById('autoSuggestMenu');
 if(!input||!menu)return;
 let q=input.value.trim().toLowerCase();
 let opts=freqValues(field).filter(v=>!q||v.toLowerCase().includes(q)).slice(0,8);
 if(!opts.length){closeSuggestMenu();return}
 currentSuggestField=field;
 menu.innerHTML=opts.map(v=>`<button type="button" class="autocomplete-option" data-value="${escapeHtml(v)}" onmousedown="event.preventDefault();chooseSuggestion('${field}',this.dataset.value)">${escapeHtml(v)}</button>`).join('');
 menu.classList.add('open');
 positionSuggestMenu(input);
}
function chooseSuggestion(field,value){let input=document.getElementById(field);if(input)input.value=value;closeSuggestMenu()}
function closeSuggestMenu(){let menu=document.getElementById('autoSuggestMenu');if(menu){menu.classList.remove('open');menu.innerHTML=''}currentSuggestField=null}
window.addEventListener('scroll',()=>{if(currentSuggestField){let input=document.getElementById(currentSuggestField);if(input)positionSuggestMenu(input);else closeSuggestMenu()}},true);
window.addEventListener('resize',()=>{if(currentSuggestField){let input=document.getElementById(currentSuggestField);if(input)positionSuggestMenu(input);else closeSuggestMenu()}});
function renderSetup(){
 window.scrollTo(0,0);
 state.wizardStep=1;
 state.wizardData={subject:'',topic:'',source:'',start:'',end:'',parity:'all'};
 renderWizardStep();
}
function renderWizardStep(){
 let step=state.wizardStep,d=state.wizardData;
 let stepsHtml=[1,2,3].map(n=>`<div class="wizard-step ${n<step?'done':''} ${n===step?'active':''}"></div>`).join('');
 let stepLabel=['مشخصات آزمون','بازه تست‌ها','نوع تست‌ها'][step-1];
 let body;
 if(step===1){
  body=`<div class="form-grid">
  <div class="field autocomplete-field"><label>نام درس</label><input id="subject" type="text" autocomplete="off" placeholder="مثلاً زیست‌شناسی" value="${escapeHtml(d.subject)}" oninput="renderSuggestMenu('subject')" onfocus="renderSuggestMenu('subject')" onblur="closeSuggestMenu()"></div>
  <div class="field autocomplete-field"><label>نام مبحث</label><input id="topic" type="text" autocomplete="off" placeholder="مثلاً فصل سوم" value="${escapeHtml(d.topic)}" oninput="renderSuggestMenu('topic')" onfocus="renderSuggestMenu('topic')" onblur="closeSuggestMenu()"></div>
  <div class="field full autocomplete-field"><label>نام کتاب / منبع تست</label><input id="source" type="text" autocomplete="off" placeholder="مثلاً زیست دهم" value="${escapeHtml(d.source)}" oninput="renderSuggestMenu('source')" onfocus="renderSuggestMenu('source')" onblur="closeSuggestMenu()"></div>
  </div>`;
 }else if(step===2){
  body=`<div class="field full range-row">
  <div class="range-field"><label>از سوال</label><input id="start" type="number" step="1" placeholder="1" value="${escapeHtml(d.start)}" oninput="updateLiveCount()"></div>
  <div class="range-field"><label>تا سوال</label><input id="end" type="number" step="1" placeholder="2000" value="${escapeHtml(d.end)}" oninput="updateLiveCount()"></div>
  </div>
  <div id="liveCount"></div>
  <div id="setupError"></div>
  <div class="notice">حداکثر تعداد تست در هر آزمون ۲۰۱ تست است. شماره تست می‌تواند هر عدد صحیحی باشد.</div>`;
 }else{
  body=`<div class="field full"><label>نوع تست‌ها</label><div class="segment">
  <label class="${d.parity==='all'?'active':''}"><input type="radio" name="parity" value="all" ${d.parity==='all'?'checked':''} onchange="toggleSegmentActive(this)"> همه تست‌ها</label>
  <label class="${d.parity==='odd'?'active':''}"><input type="radio" name="parity" value="odd" ${d.parity==='odd'?'checked':''} onchange="toggleSegmentActive(this)"> می‌خواهم تست‌های فرد را بزنم</label>
  <label class="${d.parity==='even'?'active':''}"><input type="radio" name="parity" value="even" ${d.parity==='even'?'checked':''} onchange="toggleSegmentActive(this)"> می‌خواهم تست‌های زوج را بزنم</label>

function calculateResult(e){let all=e.numbers,a=e.quizAnswers||{},k=e.keyAnswers||{},correct=[],wrong=[],blank=[];all.forEach(n=>{if(a[n]){if(Number(a[n])===Number(k[n]))correct.push(n);else wrong.push(n)}else blank.push(n)});let percent=((correct.length*3)-wrong.length)/(all.length*3)*100;return{correct,wrong,blank,correctCount:correct.length,wrongCount:wrong.length,blankCount:blank.length,percent,time:e.time}}

 if(settings.streak.lastDate===todayStr)return;
 let yesterday=new Date(today);yesterday.setDate(yesterday.getDate()-1);
 let yStr=yesterday.toISOString().slice(0,10);

function fireConfetti(){
 let canvas=document.createElement('canvas');
 canvas.id='confettiCanvas';
 canvas.style.position='fixed';canvas.style.inset='0';canvas.style.pointerEvents='none';canvas.style.zIndex='60';
 document.body.appendChild(canvas);
 let dpr=window.devicePixelRatio||1;
 canvas.width=window.innerWidth*dpr;canvas.height=window.innerHeight*dpr;
 canvas.style.width=window.innerWidth+'px';canvas.style.height=window.innerHeight+'px';
 let ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);
 let colors=['#4f8cff','#22c55e','#eab308','#ef4444','#14b8a6','#f472b6'];
 let pieces=Array.from({length:130},()=>({
  x:Math.random()*window.innerWidth,
  y:-20-Math.random()*window.innerHeight*0.4,
  w:6+Math.random()*6,
  h:9+Math.random()*7,
  color:colors[Math.floor(Math.random()*colors.length)],
  rot:Math.random()*360,
  vRot:(Math.random()-.5)*10,
  vy:2.2+Math.random()*3,
  vx:(Math.random()-.5)*2.2
 }));
 let start=Date.now();
 function frame(){
  ctx.clearRect(0,0,window.innerWidth,window.innerHeight);
  let elapsed=Date.now()-start;
  pieces.forEach(p=>{
   p.x+=p.vx;p.y+=p.vy;p.rot+=p.vRot;
   ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot*Math.PI/180);
   ctx.fillStyle=p.color;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore();
  });
  if(elapsed<3000)requestAnimationFrame(frame);else canvas.remove();
 }
 frame();
}

function calcResultOf(e){return e.result||calculateResult(e)}
function getBrowseSubjects(){
 let map={};
 exams.forEach(e=>{
  let r=calcResultOf(e);
  let subj=e.subject||'بدون نام';
  let cnt=(r.wrong?.length||0)+(r.blank?.length||0);
  if(cnt<=0)return;
  map[subj]=(map[subj]||0)+cnt;
 });
 return Object.entries(map).map(([subject,count])=>({subject,count})).sort((a,b)=>a.subject.localeCompare(b.subject,'fa'));
}
function getSubjectItems(subject){
 let items=[];
 exams.forEach(e=>{
  if((e.subject||'بدون نام')!==subject)return;
  let r=calcResultOf(e);
  (e.numbers||[]).forEach(n=>{
   let cls=r.wrong?.includes(n)?'wrong':r.blank?.includes(n)?'blank':null;
   if(!cls)return;
   items.push({itemKey:e.id+'-'+n,n,cls,source:e.source||'—',user:e.quizAnswers?.[n],correctAnswer:e.keyAnswers?.[n]});
  });
 });
 return items;
}

async function backupToFile(){
 try{
  const json=JSON.stringify({version:3,createdAt:new Date().toISOString(),exams});
  const blob=new Blob([json],{type:'application/json'});
  const fileName=`pasokhbarg-backup-${formatDateForFileName(new Date())}.json`;
  // Prefer the native share sheet when available (lets the user save the
  // file straight into Drive/Telegram/Files instead of only "Downloads"),
  // and fall back to a plain download link everywhere else.
  if(navigator.canShare&&navigator.canShare({files:[new File([blob],fileName,{type:'application/json'})]})){
   const file=new File([blob],fileName,{type:'application/json'});
   try{
    await navigator.share({files:[file],title:'پشتیبان پاسخبرگ تستی'});
    return;
   }catch(e){
    if(e&&e.name==='AbortError')return; // user cancelled the share sheet
    // fall through to plain download on any other share failure
   }
  }
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=fileName;
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url),4000);
  showToast('فایل پشتیبان ذخیره شد','success');
 }catch(e){
  showToast('ساخت فایل پشتیبان ناموفق بود: '+(e.message||'خطای نامشخص'),'error');
 }
}
function formatDateForFileName(d){
 const p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}`;
}

async function restoreFromFile(fileList){
 const files=Array.from(fileList||[]);
 const file=files[0];
 const inputEl=document.getElementById('restoreFileInput');
 if(!file){return}
 try{
  const text=await file.text();
  let d=JSON.parse(text),list=Array.isArray(d)?d:d.exams;
  if(!Array.isArray(list))throw Error();
  if(inputEl)inputEl.value='';
  showConfirm('اطلاعات فعلی با پشتیبان جایگزین شود؟',()=>{exams=list;saveExams();closeModal();renderHome();showToast('بازیابی با موفقیت انجام شد','success')},'جایگزینی');
 }catch(e){
  if(inputEl)inputEl.value='';
  showToast('فایل پشتیبان معتبر نیست.','error');
 }
}
